project_id = "spesa-intelligente"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://127.0.0.1:5173/impostazioni"]
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"
